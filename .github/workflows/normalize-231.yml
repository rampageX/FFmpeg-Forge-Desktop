name: One-time canonical source migration and upstream RAR LFS archive

on:
  push:
    branches: [release/v2.3.1]
    paths:
      - '.github/workflows/normalize-231.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.3.1
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize verified sources and repo layout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/maintenance/normalize_231.py
          test -f src/Program.cs
          test -f src/DarkNumeric.cs
          test ! -e FFmpegForge.exe
          test ! -d LiteSource
          test ! -d FFmpegForge
      - name: Archive pristine upstream RAR using Git LFS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          mkdir -p archive/upstream/v2.3.0
          gh release download '2.3.0' -R Aaronstanley78/FFmpeg-Forge-Desktop -p 'FFmpegForge-2.3.0-Portable.rar' -D archive/upstream/v2.3.0
          echo 'c63f278ffafadba93374ac0c5153b802b4c5e086b0515af7ad2d95da9b25dcc9  archive/upstream/v2.3.0/FFmpegForge-2.3.0-Portable.rar' | sha256sum --check
          test "$(stat -c%s archive/upstream/v2.3.0/FFmpegForge-2.3.0-Portable.rar)" -eq 209148735
          git add .gitattributes
          git add -A
          git lfs ls-files | tee /tmp/lfs-items.txt
          grep -q 'FFmpegForge-2.3.0-Portable.rar' /tmp/lfs-items.txt
          # This migration workflow and script are deliberately one-shot.
          git rm -f .github/workflows/normalize-231.yml scripts/maintenance/normalize_231.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'refactor: canonical 2.3.1 source tree and Git LFS upstream RAR baseline'
          git push origin HEAD:release/v2.3.1
          echo 'MIGRATION SUCCESS: verified 209 MB original RAR stored via Git LFS; source moved to src.'
