name: One-time canonical source migration and upstream RAR LFS archive

on:
  push:
    branches: [release/v2.3.1]
    paths:
      - '.github/workflows/normalize-231.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.3.1
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize verified sources and repo layout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/maintenance/normalize_231.py
          test -f src/Program.cs
          test -f src/DarkNumeric.cs
          test ! -e FFmpegForge.exe
          test ! -d LiteSource
          test ! -d FFmpegForge
      - name: Archive pristine upstream RAR as a draft Release attachment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archive/upstream/v2.3.0
          rar='archive/upstream/v2.3.0/FFmpegForge-2.3.0-Portable.rar'
          gh release download 2.3.0 -R Aaronstanley78/FFmpeg-Forge-Desktop -p 'FFmpegForge-2.3.0-Portable.rar' -D archive/upstream/v2.3.0
          echo 'c63f278ffafadba93374ac0c5153b802b4c5e086b0515af7ad2d95da9b25dcc9  archive/upstream/v2.3.0/FFmpegForge-2.3.0-Portable.rar' | sha256sum --check
          test "$(stat -c%s "$rar")" -eq 209148735
          # GitHub refuses LFS uploads from this public fork's Actions identity;
          # ordinary Git rejects >100MB. A draft Release securely backs up
          # the exact RAR without polluting public release listings or clone size.
          tag='archive-upstream-2.3.0'
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            echo "Archive release $tag already exists. Refuse to overwrite it."
            exit 1
          fi
          gh release create "$tag" "$rar" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "ARCHIVE ONLY — upstream FFmpeg Forge 2.3.0" --notes "Immutable copy of the official FFmpegForge-2.3.0-Portable.rar (209,148,735 bytes); SHA256 c63f278ffafadba93374ac0c5153b802b4c5e086b0515af7ad2d95da9b25dcc9. Do not publish this draft or attach it to Lite runtime releases."
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,assets,tagName
          rm -f "$rar"
          rm -f .gitattributes
          python3 - <<'PY'
          from pathlib import Path
          p = Path('archive/upstream/v2.3.0/README.md')
          s = p.read_text()
          s = s.replace('The RAR is tracked here using Git LFS (run git lfs pull to retrieve it).', 'The full RAR is preserved as an attachment in the owner-accessible draft GitHub Release: https://github.com/rampageX/FFmpeg-Forge-Desktop/releases/tag/archive-upstream-2.3.0 . It is not stored in normal Git due to the 100 MB object limit and the public-fork LFS restriction.')
          p.write_text(s)
          p = Path('README.md')
          s = p.read_text().replace('original 209 MB RAR (Git LFS)', 'original RAR backup manifest (owner-accessible draft Release)')
          p.write_text(s)
          p = Path('docs/DEVELOPMENT.md')
          s = p.read_text().replace('is stored with Git LFS and checked against its SHA256 manifest.', 'is backed up as the archive-upstream-2.3.0 draft Release attachment; verify its SHA256 against the archive manifest.')
          p.write_text(s)
          PY
          git add -A
          # This migration workflow and script are deliberately one-shot.
          git rm -f .github/workflows/normalize-231.yml scripts/maintenance/normalize_231.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'refactor: canonical 2.3.1 source tree; archive verified 2.3.0 RAR in draft release'
          git push origin HEAD:release/v2.3.1
          echo 'MIGRATION SUCCESS: original RAR archived as draft Release; canonical source at src/.'
