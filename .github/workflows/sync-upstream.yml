name: Review upstream updates (safe, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare upstream main without touching maintained src/
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Aaronstanley78/FFmpeg-Forge-Desktop.git
          git fetch upstream main
          echo '### Upstream GitHub main' >> "$GITHUB_STEP_SUMMARY"
          echo 'The upstream GitHub C# source may be OLDER than the official Release Source. This workflow never merges old files into src/.' >> "$GITHUB_STEP_SUMMARY"
          echo '### Upstream latest commits' >> "$GITHUB_STEP_SUMMARY"
          git log -7 --pretty=format:'- %h %s (%cs)' upstream/main >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Latest official upstream Release' >> "$GITHUB_STEP_SUMMARY"
          gh release view -R Aaronstanley78/FFmpeg-Forge-Desktop --json tagName,publishedAt --jq '"- Version: \(.tagName); published \(.publishedAt)"' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'For new releases, compare the actual Source/ embedded in their RAR to this fork src/ in a separate branch; merge changes selectively and re-run Windows UI regression tests.' >> "$GITHUB_STEP_SUMMARY"
