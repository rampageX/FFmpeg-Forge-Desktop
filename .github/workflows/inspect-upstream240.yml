name: Inspect official upstream 2.4.0 RAR source
on:
  push:
    branches: [forge/upstream240-film-preview]
    paths: [.github/workflows/inspect-upstream240.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and extract original release asset (source only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'FFmpegForge-2.4.0-Portable.rar'
          $extract = Join-Path $env:RUNNER_TEMP 'upstream240'
          $url = 'https://github.com/Aaronstanley78/FFmpeg-Forge-Desktop/releases/download/2.4.0/FFmpegForge-2.4.0-Portable.rar'
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10
          $size = (Get-Item $archive).Length
          Write-Host "Downloaded official upstream archive: $size bytes"
          if ($size -lt 300000000) { throw "Release asset truncated: $size bytes" }
          & 7z x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed: $LASTEXITCODE" }
          $files = @(Get-ChildItem $extract -Recurse -File -Filter '*.cs')
          Write-Host ("Archive C# source count: {0}" -f $files.Count)
          $files | ForEach-Object { Write-Host ('SRC: ' + $_.FullName.Substring($extract.Length+1)) }
          $preview = @($files | Where-Object { $_.Name -eq 'Preview.cs' })
          if ($preview.Count -lt 1) { throw 'No Preview.cs found in official RAR; inspect SRC paths in log' }
          $sourceDir = $preview[0].Directory.FullName
          $dst = 'experiments/upstream240-archive-src'
          New-Item -Path $dst -ItemType Directory -Force | Out-Null
          $names = @('Preview.cs','MainForm.cs','Engine.cs','Controls.cs','Program.cs','Formats.cs','Rtx.cs')
          foreach($name in $names) {
            $p = Join-Path $sourceDir $name
            if(Test-Path $p) {
              Copy-Item -LiteralPath $p -Destination (Join-Path $dst $name)
              Write-Host "Extracted source: $name"
            }
          }
          'Extracted from official FFmpegForge-2.4.0-Portable.rar downloaded 2026-11-18. Do not use as build source. Temporary inspection copies; GPL-3.0 upstream.' | Set-Content (Join-Path $dst 'ORIGIN.txt')
      - name: Commit extracted source for review on isolated development branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/upstream240-archive-src
          if (git diff --cached --quiet) { Write-Host "No source changes found"; exit 0 }
          git commit -m "test: inspect official upstream 2.4.0 archive preview source"
          git push origin "HEAD:refs/heads/forge/upstream240-film-preview"
