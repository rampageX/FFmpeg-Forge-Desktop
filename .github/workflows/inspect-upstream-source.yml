name: Inspect upstream 2.3.0 source (temporary)

on:
  push:
    branches: [forge/portable-lite]
    paths:
      - '.github/workflows/inspect-upstream-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download original official archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -Type Directory -Force -Path "$env:RUNNER_TEMP/original" | Out-Null
          gh release download 2.3.0 -R Aaronstanley78/FFmpeg-Forge-Desktop -p "FFmpegForge-2.3.0-Portable.rar" -D "$env:RUNNER_TEMP/original"
          Get-ChildItem "$env:RUNNER_TEMP/original" | Select-Object Name,Length
          & 7z x -y "-o$env:RUNNER_TEMP/unpacked" "$env:RUNNER_TEMP/original/FFmpegForge-2.3.0-Portable.rar" | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { throw "Archive extraction failed" }
      - name: Inspect bundled Source and build script
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/unpacked"
          Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -in @("MainForm.cs","Controls.cs","Program.cs","build.bat","FFmpegForge.exe") } | ForEach-Object {
            Write-Host ("FILE: " + $_.FullName.Substring($root.Length) + " BYTES: " + $_.Length)
          }
          Get-ChildItem $root -Recurse -Filter '*.cs' -File | ForEach-Object {
            $p = $_.FullName
            $s = Get-Content $p -Raw
            if ($s -match 'class Header|AssemblyInformationalVersion|class MainForm') {
              Write-Host ("SOURCE: " + $p.Substring($root.Length))
              $l = Get-Content $p
              for ($i=0; $i -lt $l.Count; $i++) {
                if ($l[$i] -match 'AssemblyInformationalVersion|AssemblyVersion|class Header|class MainForm|OnPaint|banner|gear|particle|texture|DrawImage|gold') {
                  $from=[Math]::Max(0,$i-2); $to=[Math]::Min($l.Count-1,$i+3)
                  for ($j=$from;$j -le $to;$j++) { Write-Host ("  " + ($j+1) + ": " + $l[$j]) }
                }
              }
            }
          }
