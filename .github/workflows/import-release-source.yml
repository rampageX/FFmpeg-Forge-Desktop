name: Import official 2.3.0 source (one-time)

on:
  push:
    branches: [forge/ui-dark-smooth]
    paths:
      - '.github/workflows/import-release-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge/ui-dark-smooth
          fetch-depth: 0
      - name: Import complete release sources (no compiled binaries)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/forge-original" | Out-Null
          gh release download 2.3.0 -R Aaronstanley78/FFmpeg-Forge-Desktop -p "FFmpegForge-2.3.0-Portable.rar" -D "$env:RUNNER_TEMP/forge-original"
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          & 7z x -y "-o$env:RUNNER_TEMP/forge-unpacked" "$env:RUNNER_TEMP/forge-original/FFmpegForge-2.3.0-Portable.rar" | Select-Object -Last 4
          if ($LASTEXITCODE -ne 0) { throw "Extraction failed" }
          $source="$env:RUNNER_TEMP/forge-unpacked/FFmpeg/Source"
          $v=Get-Content "$source/src/Program.cs" -Raw
          if ($v -notmatch 'AssemblyInformationalVersion\("2\.3\.0"\)') { throw "Not 2.3.0 source" }
          if (Test-Path LiteSource) { throw "LiteSource already exists; manual import only" }
          Copy-Item $source LiteSource -Recurse
          $files=Get-ChildItem LiteSource -File -Recurse
          $files | Sort-Object Length -Descending | Select-Object -First 20 FullName,Length | Format-Table | Out-String | Write-Host
          $size=($files | Measure-Object Length -Sum).Sum
          Write-Host "Source size: $size / files: $($files.Count)"
          if ($size -gt 30000000) { throw "Source too large; inspect before importing" }
          if ($files | Where-Object { $_.Extension -in @(".exe",".dll",".pdb",".rar",".zip",".7z") }) { throw "Unexpected bundled binary in Source" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LiteSource
          git commit -m "build: import verified official v2.3.0 release source for UI maintenance"
          git push origin HEAD:forge/ui-dark-smooth
