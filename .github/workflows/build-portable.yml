name: Build FFmpeg Forge Lite (Windows)

on:
  push:
    branches: [main, release/v2.3.2, forge/scale-window-ux, forge/hdr-preview-tonemap]
    paths:
      - '.github/workflows/build-portable.yml'
      - 'src/**'
      - 'shaders/**'
      - 'aidenoise/**'
      - 'qtgmc/**'
      - 'build.bat'
      - 'scripts/Build-Portable.ps1'
      - 'scripts/Test-Ui.ps1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v2.3.2 to Releases (main branch only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compile v2.3.2 and produce FFMpegForgeLite.zip
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Build-Portable.ps1 -Version 2.3.2 -UpstreamTag 2.3.0 -OutputDir dist

      - name: WinForms STA smoke tests (including RIP layout)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-Sta','-ExecutionPolicy','Bypass','-File','scripts/Test-Ui.ps1') -NoNewWindow -PassThru
          try {
            if (-not $p.WaitForExit(90000)) {
              $p.Kill()
              throw 'UI smoke exceeded 90 seconds (possible modal dialog or layout hang)'
            }
            if ($p.ExitCode -ne 0) { throw "UI smoke test failed ($($p.ExitCode))" }
          } finally { $p.Dispose() }

      - name: Upload candidate for testing
        uses: actions/upload-artifact@v4
        with:
          name: FFMpegForgeLite-2.3.2
          path: dist/FFMpegForgeLite.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish official Lite release (single ZIP only)
        if: "${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: FFmpeg Forge Lite 2.3.2'))) }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $tag = 'v2.3.2'
          gh release view $tag -R "$env:GITHUB_REPOSITORY" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite existing tag $tag" }
          $notes = @"
          FFmpeg Forge Lite 2.3.2 for Windows x64 (.NET Framework 4.x)

          Based on verified upstream FFmpeg Forge 2.3.0 official release source.

          - Consolidated all Scale and AI upscaling controls into a dedicated, dark-themed Scale window, with a prominent launch button.
          - Built-in compatibility guide and route-aware checkbox switching: Scale + OptiScaler and RTX VSR + TrueHDR can stack; incompatible output engines remain exclusive.
          - Python / ONNX AI parameters expand only when Use my AI model is checked. Custom AI stays an independent preprocessing route.
          - Mouse hover no longer steals focus from the outer settings scrollbar; clicked controls keep their native wheel behavior.
          - Main, DVD/Blu-ray RIP and Scale windows remember their position, size and maximized state, with disconnected-monitor safety.
          - Preserved earlier responsive dark UI and compact Windows portable package, without bundled FFmpeg, FFprobe or FFplay.
          - RTX and Dolby Vision helper programs and license notices remain included.

          Accepted on a real Windows desktop by the project owner. GitHub Actions verified assembly version 2.3.2.0, ZIP manifest and SHA256, Scale route compatibility, AI expansion, window geometry and RIP layout regressions.
          ZIP SHA256: $env:ZIP_SHA256

          Commit: $env:GITHUB_SHA
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $tag dist/FFMpegForgeLite.zip -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'FFmpeg Forge Lite v2.3.2' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Official release creation failed' }
