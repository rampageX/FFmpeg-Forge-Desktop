name: Build FFmpeg Forge Lite (Windows)

on:
  push:
    branches: [main, release/v2.3.3, forge/scale-window-ux, forge/hdr-preview-tonemap]
    paths:
      - '.github/workflows/build-portable.yml'
      - 'src/**'
      - 'shaders/**'
      - 'aidenoise/**'
      - 'qtgmc/**'
      - 'build.bat'
      - 'scripts/Build-Portable.ps1'
      - 'scripts/Test-Ui.ps1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v2.3.3 to Releases (main branch only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compile v2.3.3 and produce FFMpegForgeLite.zip
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Build-Portable.ps1 -Version 2.3.3 -UpstreamTag 2.3.0 -OutputDir dist

      - name: WinForms STA smoke tests (including RIP layout)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-Sta','-ExecutionPolicy','Bypass','-File','scripts/Test-Ui.ps1') -NoNewWindow -PassThru
          try {
            if (-not $p.WaitForExit(90000)) {
              $p.Kill()
              throw 'UI smoke exceeded 90 seconds (possible modal dialog or layout hang)'
            }
            if ($p.ExitCode -ne 0) { throw "UI smoke test failed ($($p.ExitCode))" }
          } finally { $p.Dispose() }

      - name: Upload candidate for testing
        uses: actions/upload-artifact@v4
        with:
          name: FFMpegForgeLite-2.3.3
          path: dist/FFMpegForgeLite.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish official Lite release (single ZIP only)
        if: "${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: FFmpeg Forge Lite 2.3.3'))) }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $tag = 'v2.3.3'
          gh release view $tag -R "$env:GITHUB_REPOSITORY" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite existing tag $tag" }
          $notes = @"
          FFmpeg Forge Lite 2.3.3 for Windows x64 (.NET Framework 4.x)

          Based on verified upstream FFmpeg Forge 2.3.0 official release source.

          - Fixed washed-out / incorrect-color HDR10 (PQ) and HLG frames in the live before/after comparison preview.
          - Preview JPEGs now use source color metadata and a display-only Hable HDR-to-SDR / BT.709 conversion based on the FGS preview approach.
          - Avoids redundant tone mapping for user-filtered SDR results and supports SDR-to-HDR / RTX TrueHDR result previews.
          - Uses FFprobe transfer, primaries, matrix and range tags. If zscale or tonemap is absent, HDR preview is skipped while export continues unchanged.
          - The actual HDR video encoding and metadata are not changed.
          - Retains the independent Scale window, compatibility guide, dark UI, AI controls and remembered window placements.
          - Portable package still excludes FFmpeg / FFprobe / FFplay; RTX and Dolby Vision helper tools and license notices remain included.

          The project owner visually accepted the HDR preview fix on Windows. GitHub Actions validated assembly version 2.3.3.0, ZIP manifest and SHA256, HDR10/HLG/SDR preview command generation, avoidance of double tone mapping, Scale route compatibility and window UI regressions.
          ZIP SHA256: $env:ZIP_SHA256

          Commit: $env:GITHUB_SHA
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $tag dist/FFMpegForgeLite.zip -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'FFmpeg Forge Lite v2.3.3' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Official release creation failed' }
