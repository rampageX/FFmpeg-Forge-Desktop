name: Build FFmpeg Forge Lite (Windows)

on:
  push:
    branches: [main, release/v2.3.5]
    paths:
      - '.github/workflows/build-portable.yml'
      - 'src/**'
      - 'shaders/**'
      - 'aidenoise/**'
      - 'qtgmc/**'
      - 'build.bat'
      - 'scripts/Build-Portable.ps1'
      - 'scripts/Test-Ui.ps1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v2.3.5 to Releases (main branch only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compile v2.3.5 and produce FFMpegForgeLite.v2.3.5.zip
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Build-Portable.ps1 -Version 2.3.5 -UpstreamTag 2.3.0 -OutputDir dist

      - name: WinForms STA smoke tests (including RIP layout)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-Sta','-ExecutionPolicy','Bypass','-File','scripts/Test-Ui.ps1') -NoNewWindow -PassThru
          try {
            if (-not $p.WaitForExit(90000)) {
              $p.Kill()
              throw 'UI smoke exceeded 90 seconds (possible modal dialog or layout hang)'
            }
            if ($p.ExitCode -ne 0) { throw "UI smoke test failed ($($p.ExitCode))" }
          } finally { $p.Dispose() }

      - name: Upload candidate for testing
        uses: actions/upload-artifact@v4
        with:
          name: FFMpegForgeLite.v2.3.5
          path: dist/FFMpegForgeLite.v2.3.5.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish official Lite release (single ZIP only)
        if: "${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: FFmpeg Forge Lite 2.3.5'))) }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $tag = 'v2.3.5'
          gh release view $tag -R "$env:GITHUB_REPOSITORY" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite existing tag $tag" }
          $notes = @"
          FFmpeg Forge Lite 2.3.5 for Windows x64 (.NET Framework 4.x)

          Palette-only update based on Lite 2.3.4 and upstream FFmpeg Forge 3.0.1 tagged source.

          - Graphite Aurora: graphite backgrounds, cyan highlights, indigo actions and refreshed progress gradients.
          - Apply the palette to the main window, settings, logs, dark controls and DVD/Blu-ray RIP.
          - Preserve the warm 35 mm filmstrip preview, all existing layouts, processing features and runtime helpers.
          - No upstream 3.0.1 processing features or AI models imported.
          - Fix Windows CI smoke-test ZIP extraction using the .NET Framework API; retain all existing regression checks.
          - Portable ZIP omits FFmpeg/FFprobe/FFplay and retains the approved upstream 2.3.0 helper binaries and licences.

          Project owner approved the palette on Windows; CI verifies the package, palette and WinForms regressions.
          ZIP SHA256: $env:ZIP_SHA256

          Commit: $env:GITHUB_SHA
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $tag dist/FFMpegForgeLite.v2.3.5.zip -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'FFmpeg Forge Lite v2.3.5' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Official release creation failed' }
