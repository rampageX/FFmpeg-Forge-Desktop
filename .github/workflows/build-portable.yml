name: Build FFmpeg Forge Lite (Windows)

on:
  push:
    branches: [main, release/v2.3.1]
    paths:
      - '.github/workflows/build-portable.yml'
      - 'src/**'
      - 'shaders/**'
      - 'aidenoise/**'
      - 'qtgmc/**'
      - 'build.bat'
      - 'scripts/Build-Portable.ps1'
      - 'scripts/Test-Ui.ps1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v2.3.1 to Releases (main branch only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compile v2.3.1 and produce FFMpegForgeLite.zip
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Build-Portable.ps1 -Version 2.3.1 -UpstreamTag 2.3.0 -OutputDir dist

      - name: WinForms STA smoke tests (including RIP layout)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-Sta','-ExecutionPolicy','Bypass','-File','scripts/Test-Ui.ps1') -NoNewWindow -PassThru
          try {
            if (-not $p.WaitForExit(90000)) {
              $p.Kill()
              throw 'UI smoke exceeded 90 seconds (possible modal dialog or layout hang)'
            }
            if ($p.ExitCode -ne 0) { throw "UI smoke test failed ($($p.ExitCode))" }
          } finally { $p.Dispose() }

      - name: Upload candidate for testing
        uses: actions/upload-artifact@v4
        with:
          name: FFMpegForgeLite-2.3.1
          path: dist/FFMpegForgeLite.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish official Lite release (single ZIP only)
        if: "${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: FFmpeg Forge Lite 2.3.1'))) }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $tag = 'v2.3.1'
          gh release view $tag -R "$env:GITHUB_REPOSITORY" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite existing tag $tag" }
          $notes = @"
          FFmpeg Forge Lite 2.3.1 for Windows x64 (.NET Framework 4.x)

          Based on verified upstream FFmpeg Forge 2.3.0 official release source.

          - Canonical source moved to src/; removed obsolete root EXEs and old v1.1.3a source directory.
          - Removed decorative banner and empty-list background images.
          - Dark scrollbars, dropdown arrows/borders, numeric spinner arrows and DVD RIP progress bar.
          - Smooth non-animated option expansion; compact, fully visible DVD/Blu-ray RIP window.
          - Slim portable package without ffmpeg.exe / ffprobe.exe / ffplay.exe. Select your own FFmpeg installation.
          - Preserved RTX and Dolby Vision helpers with relevant licenses.
          - Official upstream 2.3.0 RAR separately preserved as owner-accessible archive draft; not part of the Lite package.

          GitHub Actions verified assembly version 2.3.1.0, SHA256, ZIP manifest and Windows GUI layout smoke tests.
          ZIP SHA256: $env:ZIP_SHA256

          Commit: $env:GITHUB_SHA
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $tag dist/FFMpegForgeLite.zip -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'FFmpeg Forge Lite v2.3.1' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Official release creation failed' }
