name: Build FFmpeg Forge Lite (Windows)

on:
  push:
    branches: [main, release/v2.3.4, test/graphite-3.0.1]
    paths:
      - '.github/workflows/build-portable.yml'
      - 'src/**'
      - 'shaders/**'
      - 'aidenoise/**'
      - 'qtgmc/**'
      - 'build.bat'
      - 'scripts/Build-Portable.ps1'
      - 'scripts/Test-Ui.ps1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v2.3.4 to Releases (main branch only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compile v2.3.4 and produce FFMpegForgeLite.v2.3.4.zip
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/Build-Portable.ps1 -Version 2.3.4 -UpstreamTag 2.3.0 -OutputDir dist

      - name: WinForms STA smoke tests (including RIP layout)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-Sta','-ExecutionPolicy','Bypass','-File','scripts/Test-Ui.ps1') -NoNewWindow -PassThru
          try {
            if (-not $p.WaitForExit(90000)) {
              $p.Kill()
              throw 'UI smoke exceeded 90 seconds (possible modal dialog or layout hang)'
            }
            if ($p.ExitCode -ne 0) { throw "UI smoke test failed ($($p.ExitCode))" }
          } finally { $p.Dispose() }

      - name: Upload candidate for testing
        uses: actions/upload-artifact@v4
        with:
          name: FFMpegForgeLite.v2.3.4
          path: dist/FFMpegForgeLite.v2.3.4.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish official Lite release (single ZIP only)
        if: "${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: FFmpeg Forge Lite 2.3.4'))) }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $tag = 'v2.3.4'
          gh release view $tag -R "$env:GITHUB_REPOSITORY" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite existing tag $tag" }
          $notes = @"
          FFmpeg Forge Lite 2.3.4 for Windows x64 (.NET Framework 4.x)

          Based on verified upstream FFmpeg Forge 2.3.0 source and the authentic 2.4.0 filmstrip preview UI from the official upstream Portable RAR.

          - New 35 mm live filmstrip: sprocket holes, frame numbering, vignette, rolling transitions, REC / DONE / STOPPED, timecode, progress and ETA.
          - Pause/P immediately freezes preview and animation without pausing video encoding.
          - Review up to 16 recently sampled original/final pairs via ◀/▶ or PageUp/PageDown; Live resumes monitoring.
          - Space toggles slider and side-by-side; Left/Right adjust the comparison split.
          - Preserves the v2.3.3 HDR10 PQ/HLG Hable-to-BT.709 preview colour correction, SDR bypass and duplicate-tonemap avoidance.
          - Encoding, HDR video metadata, Scale/OptiScaler, RTX/AI, dark UI, DVD RIP and window geometry remain unchanged.
          - Portable ZIP omits FFmpeg/FFprobe/FFplay but retains original approved upstream helper executables and licence notices.
          - One release ZIP named FFMpegForgeLite.v2.3.4.zip; GitHub automatically provides the two source archives.

          Project owner approved the new filmstrip and Pause/Live on Windows. CI validates the version, package, HDR/SDR preview, pause/review buffer and standard WinForms, Scale and DVD RIP regressions.
          ZIP SHA256: $env:ZIP_SHA256

          Commit: $env:GITHUB_SHA
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $tag dist/FFMpegForgeLite.v2.3.4.zip -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'FFmpeg Forge Lite v2.3.4' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Official release creation failed' }
