<!doctype html><html><body style="margin:0;background:#000">
<canvas id="h" width="2600" height="300"></canvas><br>
<canvas id="d" width="1800" height="1000"></canvas>
<script>
// deterministic random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function streaks(g, W, H, n, cx, cy, spread, alpha) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const y0 = cy + (rnd() - 0.5) * spread, x0 = cx + (rnd() - 0.5) * W * 0.3;
    const len = W * (0.25 + rnd() * 0.6), ang = (rnd() - 0.5) * 0.35, th = 1 + rnd() * 3.5;
    const gr = g.createLinearGradient(x0 - len / 2, 0, x0 + len / 2, 0);
    const a = alpha * (0.3 + rnd() * 0.7);
    gr.addColorStop(0, 'rgba(255,170,60,0)'); gr.addColorStop(0.5, `rgba(255,${180 + rnd() * 50 | 0},90,${a})`); gr.addColorStop(1, 'rgba(255,170,60,0)');
    g.save(); g.translate(x0, y0); g.rotate(ang); g.translate(-x0, -y0);
    g.fillStyle = gr; g.filter = `blur(${th * 0.8}px)`; g.fillRect(x0 - len / 2, y0 - th / 2, len, th); g.restore();
  }
  g.restore();
}
function bokeh(g, W, H, n, x0, x1, y0, y1, maxr) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0), r = 0.6 + rnd() * maxr;
    const gr = g.createRadialGradient(x, y, 0, x, y, r * 3);
    const a = 0.25 + rnd() * 0.75;
    gr.addColorStop(0, `rgba(255,${190 + rnd() * 60 | 0},110,${a})`); gr.addColorStop(1, 'rgba(255,160,60,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 3, 0, 7); g.fill();
  }
  g.restore();
}
function glow(g, x, y, r, col) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
function reel(g, cx, cy, R) {
  g.save();
  // outer ring
  const rg = g.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
  rg.addColorStop(0, '#3a3f4c'); rg.addColorStop(0.6, '#1b1f29'); rg.addColorStop(1, '#0b0d12');
  g.fillStyle = rg; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
  g.lineWidth = R * 0.05; g.strokeStyle = 'rgba(255,190,90,0.55)'; g.beginPath(); g.arc(cx, cy, R * 0.97, -2.6, -0.2); g.stroke();
  g.strokeStyle = 'rgba(120,130,150,0.35)'; g.lineWidth = R * 0.02; g.beginPath(); g.arc(cx, cy, R * 0.86, 0, 7); g.stroke();
  // holes
  g.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + 0.3; g.beginPath(); g.arc(cx + Math.cos(a) * R * 0.52, cy + Math.sin(a) * R * 0.52, R * 0.22, 0, 7); g.fill(); }
  g.beginPath(); g.arc(cx, cy, R * 0.09, 0, 7); g.fill();
  g.globalCompositeOperation = 'source-over';
  // hub
  g.fillStyle = '#2a2f3b'; g.beginPath(); g.arc(cx, cy, R * 0.2, 0, 7); g.fill();
  g.fillStyle = '#0c0e13'; g.beginPath(); g.arc(cx, cy, R * 0.08, 0, 7); g.fill();
  g.strokeStyle = 'rgba(255,200,110,0.6)'; g.lineWidth = R * 0.012; g.beginPath(); g.arc(cx, cy, R * 0.2, -2.4, -0.6); g.stroke();
  g.restore();
}
function scene(g, x, y, w, h, kind) {
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const pal = [['#0d2a4d', '#2f6aa8', '#c9e3ff'], ['#2b1405', '#c46a18', '#ffd27a'], ['#091a14', '#1f5a46', '#a9e6c8'], ['#160c2c', '#5a3a9a', '#f0c8ff'], ['#0b1c33', '#3a7bbf', '#fff1c4']][kind % 5];
  const sky = g.createLinearGradient(0, y, 0, y + h); sky.addColorStop(0, pal[0]); sky.addColorStop(0.65, pal[1]); sky.addColorStop(1, pal[2]);
  g.fillStyle = sky; g.fillRect(x, y, w, h);
  glow(g, x + w * (0.3 + 0.4 * (kind % 3) / 2), y + h * 0.62, h * 0.5, 'rgba(255,220,150,0.55)');
  // mountains
  g.fillStyle = 'rgba(8,12,22,0.85)'; g.beginPath(); g.moveTo(x, y + h);
  for (let i = 0; i <= 10; i++) g.lineTo(x + w * i / 10, y + h * (0.55 + 0.18 * Math.sin(i * 1.7 + kind) * Math.cos(i * 0.6)));
  g.lineTo(x + w, y + h); g.fill();
  // trees
  g.fillStyle = 'rgba(4,6,12,0.95)';
  for (let i = 0; i < 14; i++) { const tx = x + w * rnd(), th = h * (0.18 + rnd() * 0.25), tw = th * 0.35; g.beginPath(); g.moveTo(tx, y + h - th); g.lineTo(tx - tw / 2, y + h); g.lineTo(tx + tw / 2, y + h); g.fill(); }
  g.restore();
}
function strip(g, pts, frames, fh) {
  // pts: function t -> {x,y,s} along the strip (s = scale)
  for (let i = 0; i < frames; i++) {
    const t = i / frames, p = pts(t), q = pts((i + 1) / frames);
    const w = Math.hypot(q.x - p.x, q.y - p.y), h = fh * p.s, ang = Math.atan2(q.y - p.y, q.x - p.x);
    g.save(); g.translate(p.x, p.y); g.rotate(ang);
    g.fillStyle = '#07090d'; g.fillRect(0, -h / 2, w + 1, h);
    // sprocket holes
    g.fillStyle = 'rgba(200,170,120,0.35)';
    const hs = h * 0.07; for (let k = 0; k < 4; k++) { g.fillRect(w * (0.08 + k * 0.24), -h / 2 + hs * 0.6, hs * 1.1, hs * 0.9); g.fillRect(w * (0.08 + k * 0.24), h / 2 - hs * 1.5, hs * 1.1, hs * 0.9); }
    scene(g, w * 0.05, -h / 2 + h * 0.17, w * 0.9, h * 0.66, i);
    g.strokeStyle = 'rgba(255,200,120,0.25)'; g.lineWidth = 1; g.strokeRect(w * 0.05, -h / 2 + h * 0.17, w * 0.9, h * 0.66);
    g.restore();
  }
}
// ---------------- header 2600 x 300
{
  const c = document.getElementById('h'), g = c.getContext('2d'), W = c.width, H = c.height;
  const bg = g.createLinearGradient(0, 0, W, 0); bg.addColorStop(0, '#0a0f1c'); bg.addColorStop(0.55, '#0d1424'); bg.addColorStop(1, '#141220');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  glow(g, 300, 40, 520, 'rgba(59,130,246,0.22)');
  glow(g, W * 0.62, H * 0.55, 700, 'rgba(255,150,40,0.20)');
  glow(g, W * 0.8, H * 0.3, 420, 'rgba(255,190,90,0.18)');
  reel(g, W * 0.665, H * 0.42, 210);
  streaks(g, W, H, 60, W * 0.62, H * 0.52, H * 0.9, 0.55);
  bokeh(g, W, H, 220, W * 0.38, W, 0, H, 3.5);
  // left fade for the title
  const lf = g.createLinearGradient(0, 0, W * 0.5, 0); lf.addColorStop(0, 'rgba(8,11,20,0.92)'); lf.addColorStop(0.75, 'rgba(8,11,20,0.55)'); lf.addColorStop(1, 'rgba(8,11,20,0)');
  g.fillStyle = lf; g.fillRect(0, 0, W * 0.5, H);
  const bf = g.createLinearGradient(0, H * 0.7, 0, H); bf.addColorStop(0, 'rgba(8,11,20,0)'); bf.addColorStop(1, 'rgba(8,11,20,0.75)');
  g.fillStyle = bf; g.fillRect(0, 0, W, H);
}
// ---------------- drop zone 1800 x 1000
{
  const c = document.getElementById('d'), g = c.getContext('2d'), W = c.width, H = c.height;
  const bg = g.createRadialGradient(W * 0.5, H * 0.45, 50, W * 0.5, H * 0.5, W * 0.7);
  bg.addColorStop(0, '#13213e'); bg.addColorStop(0.6, '#0b1222'); bg.addColorStop(1, '#070a12');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  glow(g, W * 0.5, H * 0.42, 500, 'rgba(255,170,60,0.16)');
  // two perspective film strips crossing behind the centre
  strip(g, t => ({ x: -200 + t * (W + 400), y: H * 0.30 + Math.sin(t * 3.1) * 70 - t * 40, s: 0.7 + 0.6 * Math.sin(t * Math.PI) }), 11, 260);
  strip(g, t => ({ x: -150 + t * (W + 300), y: H * 0.68 + Math.cos(t * 2.6) * 60, s: 0.55 + 0.5 * Math.sin(t * Math.PI) }), 12, 220);
  streaks(g, W, H, 50, W * 0.5, H * 0.5, H * 0.8, 0.45);
  bokeh(g, W, H, 260, 0, W, 0, H, 3);
  // darken centre for the text
  const cv = g.createRadialGradient(W * 0.5, H * 0.5, 40, W * 0.5, H * 0.5, W * 0.36);
  cv.addColorStop(0, 'rgba(7,10,18,0.86)'); cv.addColorStop(0.55, 'rgba(7,10,18,0.66)'); cv.addColorStop(1, 'rgba(7,10,18,0.08)');
  glow(g, W * 0.5, H * 0.36, 260, 'rgba(255,170,60,0.22)');
  g.fillStyle = cv; g.fillRect(0, 0, W, H);
}
document.title = 'done';
</script></body></html>
